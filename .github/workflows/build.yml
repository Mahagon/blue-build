---
name: bluebuild
on:
  workflow_dispatch:
  schedule:
    - cron: "15 04 * * *"
  push:
    paths-ignore:
      - "**.md"
      - ".github/renovate.json"
      - ".github/CODEOWNERS"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  discover-scripts:
    name: Discover scripts
    runs-on: ubuntu-latest
    outputs:
      work-install-scripts: ${{ steps.find.outputs.work-install-scripts }}
      gaming-install-scripts: ${{ steps.find.outputs.gaming-install-scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find install scripts
        id: find
        run: |
          echo "work-install-scripts=$(find files/scripts/shared files/scripts/work -name '*.sh' -type f | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "gaming-install-scripts=$(find files/scripts/shared files/scripts/gaming -name '*.sh' -type f | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Syntax check all scripts
        run: find files .github -name '*.sh' -type f -exec bash -n {} +
      - name: Shellcheck all scripts
        run: find files .github -name '*.sh' -type f -exec shellcheck --severity=error {} +
      - name: Check recipes list every install script
        run: .github/scripts/check-recipe-scripts.sh
  test-work-install-scripts:
    name: Test work script ${{ matrix.script }}
    needs: [discover-scripts, changes]
    if: needs.changes.outputs.work == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(needs.discover-scripts.outputs.work-install-scripts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run install script and check it installed something
        run: .github/scripts/test-install-script.sh "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script }}
  test-gaming-install-scripts:
    name: Test gaming script ${{ matrix.script }}
    needs: [discover-scripts, changes]
    if: needs.changes.outputs.gaming == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(needs.discover-scripts.outputs.gaming-install-scripts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run install script and check it installed something
        run: .github/scripts/test-install-script.sh "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script }}
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      # Scheduled runs build both; manual runs build gaming; pushes build what changed.
      work: ${{ github.event_name == 'schedule' || steps.filter.outputs.work == 'true' }}
      gaming: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.gaming == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            work:
              - 'recipes/work.yml'
              - 'files/work/**'
              - 'files/shared/**'
              - 'files/scripts/shared/**'
              - 'files/scripts/work/**'
              - '.github/scripts/**'
              - '.github/workflows/build.yml'
            gaming:
              - 'recipes/gaming.yml'
              - 'files/gaming/**'
              - 'files/shared/**'
              - 'files/scripts/shared/**'
              - 'files/scripts/gaming/**'
              - '.github/scripts/**'
              - '.github/workflows/build.yml'
  build-work:
    name: Build Custom Image (work.yml)
    needs: [lint-scripts, test-work-install-scripts, changes]
    if: needs.changes.outputs.work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@fb86c457fd3d0e13d5e9c1875c6305cf28b09234 # v1.14
        with:
          recipe: work.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # build_chunked_oci: true
          # maximize_build_space: true
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mahagon/work-aurora-desktop:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
      - name: Cleanup old images from GHCR
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1
        with:
          older-than: 7 days
          package: work-aurora-desktop
  build-gaming:
    name: Build Custom Image (gaming.yml)
    needs: [lint-scripts, test-gaming-install-scripts, changes]
    if: needs.changes.outputs.gaming == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@fb86c457fd3d0e13d5e9c1875c6305cf28b09234 # v1.14
        with:
          recipe: gaming.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          retry_push_count: 3
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mahagon/gaming-desktop:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
      - name: Cleanup old images from GHCR
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1
        with:
          older-than: 7 days
          package: gaming-desktop
